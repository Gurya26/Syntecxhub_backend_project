<!DOCTYPE html>
<html>
<head>
  <title>User Manager</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background: green;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .user {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .actions button {
      width: auto;
      margin-left: 5px;
      padding: 5px 10px;
    }

    .edit {
      background: blue;
    }

    .delete {
      background: red;
    }

    #message {
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Add User</h2>

  <div id="message"></div>

  <input id="name" placeholder="Enter name">
  <input id="email" placeholder="Enter email">
  <button onclick="submitUser()">Add User</button>

  <h2>Users</h2>
  <div id="users"></div>

</div>

<script>

let editingId = null;

// Show message
function showMessage(text, color) {
  const msg = document.getElementById("message");
  msg.innerText = text;
  msg.style.color = color;

  setTimeout(() => {
    msg.innerText = "";
  }, 3000);
}

// Load users
async function loadUsers() {
  const res = await fetch("/users");
  const data = await res.json();

  const usersDiv = document.getElementById("users");
  usersDiv.innerHTML = "";

  data.forEach(user => {
    usersDiv.innerHTML += `
      <div class="user">
        <span>${user.name} (${user.email})</span>
        <div class="actions">
          <button class="edit" onclick="editUser('${user._id}','${user.name}','${user.email}')">Edit</button>
          <button class="delete" onclick="deleteUser('${user._id}')">Delete</button>
        </div>
      </div>
    `;
  });
}

// Add / Update user
async function submitUser() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;

  if (!name || !email) {
    showMessage("All fields required ❌", "red");
    return;
  }

  try {
    if (editingId) {
      await fetch(`/users/${editingId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email })
      });

      showMessage("User updated ✏️", "blue");
      editingId = null;

    } else {
      await fetch("/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email })
      });

      showMessage("User added ✅", "green");
    }

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";

    loadUsers();

  } catch (err) {
    showMessage("Error occurred ❌", "red");
  }
}

// Edit
function editUser(id, name, email) {
  document.getElementById("name").value = name;
  document.getElementById("email").value = email;
  editingId = id;
}

// Delete
async function deleteUser(id) {
  const confirmDelete = confirm("Are you sure?");
  if (!confirmDelete) return;

  await fetch(`/users/${id}`, { method: "DELETE" });

  showMessage("User deleted ❌", "red");
  loadUsers();
}

// Initial load
loadUsers();

</script>

</body>
</html>
